<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Агломерации Израиля — Интерактивная карта</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100vh; }
    .filters {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
      z-index: 1000;
      font-family: sans-serif;
      font-size: 14px;
      max-width: 200px;
    }
    .filters label { display: block; margin-bottom: 5px; cursor: pointer; }
  </style>
</head>
<body>

<div class="filters">
  <strong>Фильтры</strong>
  <label><input type="checkbox" id="filter-jewish" checked /> Еврейские</label>
  <label><input type="checkbox" id="filter-arabic" checked /> Арабские</label>
  <label><input type="checkbox" id="filter-tourism" checked /> Туризм</label>
  <label><input type="checkbox" id="filter-hi-tech" checked /> Хай-тек</label>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([31.5, 34.9], 8);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
  }).addTo(map);

  let geojsonLayer;
  let markers = [];

  // Функция цвета по населению
  function getColor(population) {
    if (population > 3000000) return '#800026';
    if (population > 1000000) return '#BD0026';
    if (population > 500000) return '#E31A1C';
    if (population > 200000) return '#FC4E2A';
    if (population > 100000) return '#FD8D3C';
    return '#FEB24C';
  }

  // Загрузка GeoJSON и отрисовка
  function loadData() {
    fetch('agglomerations.geojson')
      .then(response => response.json())
      .then(data => {
        if (geojsonLayer) {
          map.removeLayer(geojsonLayer);
          markers.forEach(m => map.removeLayer(m));
          markers = [];
        }

        geojsonLayer = L.geoJSON(data, {
          style: feature => ({
            color: '#0057A8',
            weight: 2,
            fillOpacity: 0.1,
          }),
          onEachFeature: (feature, layer) => {
            layer.bindPopup(
              `<b>${feature.properties.name}</b><br/>
               Население: ${feature.properties.population.toLocaleString()}<br/>
               Религия: ${feature.properties.religion}<br/>
               Деятельность: ${feature.properties.activity}`
            );
          }
        }).addTo(map);

        // Добавляем круги-маркеры в центре полигона
        data.features.forEach(feature => {
          const center = getFeatureCenter(feature);
          const props = feature.properties;
          const marker = L.circleMarker(center, {
            radius: 10,
            color: '#000',
            fillColor: getColor(props.population),
            fillOpacity: 0.8
          })
          .bindPopup(
            `<b>${props.name}</b><br/>
             Население: ${props.population.toLocaleString()}<br/>
             Религия: ${props.religion}<br/>
             Деятельность: ${props.activity}`
          )
          .addTo(map);

          markers.push(marker);
        });

        applyFilters();
      });
  }

  // Примерная центроид-функция полигона
  function getFeatureCenter(feature) {
    const coords = feature.geometry.coordinates[0]; // предполагается Polygon
    let latSum = 0, lngSum = 0;
    coords.forEach(c => {
      lngSum += c[0];
      latSum += c[1];
    });
    return [latSum / coords.length, lngSum / coords.length];
  }

  // Фильтрация по чекбоксам
  function applyFilters() {
    const showJewish = document.getElementById('filter-jewish').checked;
    const showArabic = document.getElementById('filter-arabic').checked;
    const showTourism = document.getElementById('filter-tourism').checked;
    const showHiTech = document.getElementById('filter-hi-tech').checked;

    geojsonLayer.eachLayer(layer => {
      const props = layer.feature.properties;
      const rel = props.religion.toLowerCase();
      const act = props.activity.toLowerCase();

      const showReligion = (rel === 'jewish' && showJewish) ||
                           (rel === 'arabic' && showArabic) ||
                           (rel === 'mixed' && (showJewish || showArabic));
      const showActivity = (act === 'hi-tech' && showHiTech) ||
                           (act === 'tourism' && showTourism);

      if (showReligion && showActivity) {
        layer.addTo(map);
      } else {
        map.removeLayer(layer);
      }
    });

    markers.forEach(marker => {
      const props = marker.featureProps;
      const rel = props.religion.toLowerCase();
      const act = props.activity.toLowerCase();

      const showReligion = (rel === 'jewish' && showJewish) ||
                           (rel === 'arabic' && showArabic) ||
                           (rel === 'mixed' && (showJewish || showArabic));
      const showActivity = (act === 'hi-tech' && showHiTech) ||
                           (act === 'tourism' && showTourism);

      if (showReligion && showActivity) {
        marker.addTo(map);
      } else {
        map.removeLayer(marker);
      }
    });
  }

  // Связываем свойства с маркерами для фильтрации
  function linkPropsToMarkers() {
    markers.forEach(marker => {
      const found = geojsonLayer.getLayers().find(layer => {
        const center = getFeatureCenter(layer.feature);
        return center[0] === marker.getLatLng().lat && center[1] === marker.getLatLng().lng;
      });
      if (found) marker.featureProps = found.feature.properties;
    });
  }

  // Инициализация
  loadData();

  // Повесить обработчики фильтров
  document.querySelectorAll('.filters input').forEach(input => {
    input.addEventListener('change', () => {
      applyFilters();
    });
  });

  // Дождаться загрузки и связать свойства с маркерами
  setTimeout(linkPropsToMarkers, 1000);

</script>

</body>
</html>
